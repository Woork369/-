<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>🌞 Лето 5.1</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:#fff;color:#1f2430;overflow:hidden;user-select:none}
  #topbar{display:flex;gap:6px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid #e6e9ef;flex-wrap:wrap}
  #topbar .logo{font-weight:800;font-size:17px;margin-right:10px;background:linear-gradient(135deg,#4c6ef5,#e8590c);-webkit-background-clip:text;background-clip:text;color:transparent}
  #topbar button{padding:7px 14px;border:1px solid #e6e9ef;border-radius:8px;background:#f8f9fc;cursor:pointer;font-size:13px;font-weight:500}
  #topbar button:hover{background:#eef2ff;border-color:#c7d2fe}
  #topbar button.primary{background:#4c6ef5;color:#fff;border-color:#4c6ef5}
  #topbar .hint{font-size:12px;color:#868e96;margin-left:auto}
  #errbar{display:none;padding:8px 14px;background:#ffe3e3;color:#c92a2a;font-size:12px;border-bottom:1px solid #ffc9c9}
  #main{display:flex;height:calc(100% - 56px - 30px)}
  #cats{width:190px;background:#fafbfd;border-right:1px solid #e6e9ef;overflow-y:auto;padding:10px 6px;flex-shrink:0}
  #cats .cat{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:3px;color:#4a5163}
  #cats .cat:hover{background:#eef2ff;color:#1f2430}
  #cats .cat.active{background:#4c6ef5;color:#fff;font-weight:600}
  #cats .cat .num{font-size:11px;background:rgba(0,0,0,.06);padding:1px 6px;border-radius:8px}
  #cats .cat.active .num{background:rgba(255,255,255,.25)}
  #palette{width:250px;background:#fff;border-right:1px solid #e6e9ef;overflow-y:auto;padding:10px;flex-shrink:0}
  #palette .search{width:100%;padding:8px 10px;border:1px solid #e6e9ef;border-radius:8px;font-size:12px;margin-bottom:10px;outline:none}
  #palette .search:focus{border-color:#4c6ef5;box-shadow:0 0 0 3px rgba(76,110,245,.12)}
  #palette .hint{font-size:11px;color:#adb5bd;margin-bottom:8px;line-height:1.4}
  .pblock{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;margin-bottom:6px;cursor:grab;font-size:12px;background:#fff;border:1px solid #e6e9ef;border-left:4px solid var(--c,#4c6ef5);transition:.12s}
  .pblock:hover{background:#f8faff;border-color:#c7d2fe;transform:translateX(2px);box-shadow:0 2px 8px rgba(76,110,245,.12)}
  .pblock .icon{width:24px;height:24px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--c,#4c6ef5);color:#fff;font-size:12px;font-weight:700}
  .pblock .label{flex:1;line-height:1.25;font-weight:500}
  #canvasWrap{flex:1;position:relative;overflow:auto;background:#fff;background-image:linear-gradient(#f0f2f7 1px,transparent 1px),linear-gradient(90deg,#f0f2f7 1px,transparent 1px);background-size:28px 28px}
  #canvas{position:relative;min-width:100%;min-height:100%;padding:30px}
  .block{position:absolute;font-size:12px;background:#fff;border:1px solid #e6e9ef;border-left:5px solid var(--c,#4c6ef5);border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.06),0 8px 20px -12px rgba(0,0,0,.15);cursor:grab;display:flex;flex-direction:column;min-width:200px;z-index:1}
  .block.dragging{box-shadow:0 8px 24px rgba(76,110,245,.35);z-index:999}
  .block.hasNext::after{content:'';position:absolute;bottom:-7px;left:20px;width:40px;height:8px;background:var(--c);border-radius:0 0 4px 4px}
  .block.isRoot{border-left-color:#f59f00}
  .block .snap-point{position:absolute;bottom:-11px;left:34px;width:12px;height:12px;border-radius:50%;background:#4c6ef5;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s;cursor:crosshair;z-index:5}
  .block:hover .snap-point{opacity:.9;pointer-events:auto}
  .block .snap-point:hover{transform:scale(1.4);opacity:1}
  .block .head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;cursor:grab;border-radius:10px 10px 0 0}
  .block .bicon{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--c,#4c6ef5);color:#fff;font-size:13px;font-weight:700}
  .block .btitle{font-weight:600;font-size:12.5px;flex:1;line-height:1.2}
  .block .body{padding:8px 12px 12px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px dashed #e6e9ef}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:10px;color:#868e96;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .field input,.field select,.field textarea{padding:5px 8px;border:1px solid #e6e9ef;border-radius:6px;font-size:12px;background:#fafbfd;outline:none;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:#4c6ef5;background:#fff;box-shadow:0 0 0 3px rgba(76,110,245,.12)}
  .field input[type=color]{padding:2px;width:100%;height:32px;cursor:pointer;background:#fff}
  .block .del{width:22px;height:22px;border-radius:6px;border:none;background:#f1f3f9;color:#868e96;cursor:pointer;font-size:14px;line-height:1;padding:0;flex-shrink:0}
  .block .del:hover{background:#ffe3e3;color:#e03131}
  .block .children-info{font-size:10px;color:#868e96;padding:2px 8px;background:#f1f3f9;border-radius:6px;margin-left:auto}
  .prev-btn{display:inline-block;padding:6px 14px;border-radius:6px;background:#f1f3f9;color:#1f2430;font-size:11px;font-weight:500;text-align:center;pointer-events:none}
  .prev-btn.primary{background:#4c6ef5;color:#fff}
  .prev-btn.danger{background:#e03131;color:#fff}
  .prev-btn.success{background:#2f9e44;color:#fff}
  .prev-card{background:#f8f9fa;border-radius:10px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);font-size:11px}
  .prev-card h4{margin-bottom:4px;font-size:12px}
  .prev-table{border-collapse:collapse;font-size:11px;width:100%}
  .prev-table td{border:1px solid #dee2e6;padding:4px 8px}
  .prev-input{padding:5px 8px;border:1px solid #ced4da;border-radius:6px;background:#fff;font-size:11px;color:#495057}
  #previewArea{flex:1;background:#fff;border-left:1px solid #e6e9ef;display:flex;flex-direction:column;min-width:0}
  #previewHead{padding:8px 14px;font-size:12px;color:#868e96;border-bottom:1px solid #e6e9ef;background:#fafbfd;display:flex;justify-content:space-between;align-items:center}
  #previewHead .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#51cf66;margin-right:6px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  #previewWrap{flex:1;position:relative;overflow:hidden;background:#fff}
  #previewFrame{width:100%;height:100%;border:0;background:#fff}
  #statusbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fff;border-top:1px solid #e6e9ef;font-size:12px;color:#868e96}
  #statusbar b{color:#1f2430}
  #tooltip{position:fixed;padding:8px 12px;background:#1f2430;color:#fff;font-size:11.5px;border-radius:8px;max-width:280px;line-height:1.4;pointer-events:none;opacity:0;transition:opacity .15s;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  #tooltip.show{opacity:1}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#fafbfd}
  ::-webkit-scrollbar-thumb{background:#e6e9ef;border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:#c7d2fe}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">🌞 Лето 5.1</div>
  <button id="btnBuild" class="primary">▶ Собрать</button>
  <button id="btnClear">🗑 Очистить</button>
  <button id="btnSave">💾 Сохранить</button>
  <button id="btnOpen">📂 Открыть</button>
  <button id="btnCode">👁 Код</button>
  <div class="hint">💡 Потяни за синий кружок снизу блока — соедини со следующим.</div>
</div>

<div id="errbar"></div>

<div id="main">
  <div id="cats"></div>
  <div id="palette">
    <input class="search" id="search" placeholder="🔍 Поиск блока…">
    <div class="hint">Нажми на блок — добавится на холст.</div>
    <div id="paletteList"></div>
  </div>
  <div id="canvasWrap"><div id="canvas"></div></div>
  <div id="previewArea">
    <div id="previewHead"><span><span class="dot"></span>Живой предпросмотр</span><span id="previewInfo">0 строк</span></div>
    <div id="previewWrap">
      <iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-modals allow-same-origin"></iframe>
    </div>
  </div>
</div>

<div id="statusbar">
  <span id="statusLeft">Готово</span>
  <span>Блоков: <b id="statusCount">0</b> · Связей: <b id="statusLinks">0</b> · Всего в наборе: <b id="statusTotal">0</b></span>
</div>

<div id="tooltip"></div>
<input type="file" id="fileInput" accept=".leto,.json" style="display:none">

<script>
/* ================================================================
   ЛЕТО 5.1 — исправленный предпросмотр
   ================================================================ */

const J = v => JSON.stringify(v);

function B(type, label, colour, icon, fields, code, opts){
  return {
    type, label, colour, icon: icon||'●',
    fields: fields||[], code,
    shape: (opts && opts.shape) || 'simple',
    help:  (opts && opts.help)  || '',
    isStyle:  !!(opts && opts.isStyle),
    isRoot:   !!(opts && opts.isRoot),
    previewClass: (opts && opts.previewClass) || '',
    bg: (opts && opts.bg) || null,
    size: (opts && opts.size) || null,
  };
}
const F = {
  text:  (name, label, def)       => ({name, label, type:'text',  def}),
  num:   (name, label, def)       => ({name, label, type:'number',def}),
  color: (name, label, def)       => ({name, label, type:'color', def}),
  select:(name, label, opts, def) => ({name, label, type:'select',options:opts,def}),
  area:  (name, label, def)       => ({name, label, type:'area',  def}),
};

const COLOURS = [
  ['чёрный','#000000'],['белый','#ffffff'],['красный','#e03131'],['синий','#4c6ef5'],
  ['зелёный','#2f9e44'],['жёлтый','#fcc419'],['оранжевый','#f76707'],['фиолетовый','#7048e8'],
  ['розовый','#f06595'],['бирюза','#15aabf'],['серый','#868e96'],['мятный','#63e6be'],
];

function safeBuild(name, colour, fn){
  try { return { name, colour, blocks: fn() || [] }; }
  catch(e){ console.error('❌', name, e); return { name: name+' ⚠', colour, blocks: [] }; }
}

/* ================================================================
   ВЕСЬ САЙТ
   ================================================================ */
function buildRoot(){
  return [
    B('root_site','🌐 Весь сайт','#f59f00','🌐',[],
      ()=>'',
      {isRoot:true, help:'Прицепи стили сверху — они применятся ко всей странице.'})
  ];
}

/* ================================================================
   СТРАНИЦА
   ================================================================ */
function buildPage(){
  const out = [];
  out.push(B('p_title','Заголовок страницы','#4c6ef5','T',
    [F.text('V','Что в строке','Мой сайт')],
    v=>`document.title=${J(v.V)};\n`,
    {isStyle:true, help:'Надпись на вкладке браузера.'}));

  out.push(B('p_bg','Цвет фона страницы','#4c6ef5','▣',
    [F.color('C','Какой цвет','#ffffff')],
    v=>`document.body.style.background=${J(v.C)};\n`,
    {isStyle:true}));

  out.push(B('p_color','Цвет текста страницы','#4c6ef5','A',
    [F.color('C','Какой цвет','#1f2430')],
    v=>`document.body.style.color=${J(v.C)};\n`,
    {isStyle:true}));

  out.push(B('p_lang','Язык страницы','#4c6ef5','🌍',
    [F.select('L','Какой язык',['ru','en','de','fr','es'],'ru')],
    v=>`document.documentElement.lang=${J(v.L)};\n`,
    {isStyle:true}));

  out.push(B('p_reset','Обнулить отступы','#4c6ef5','⟲',[],
    ()=>`document.body.style.margin='0';document.body.style.padding='0';\n`,
    {isStyle:true}));

  out.push(B('p_smooth','Плавная прокрутка','#4c6ef5','↝',[],
    ()=>`document.documentElement.style.scrollBehavior='smooth';\n`,
    {isStyle:true}));

  out.push(B('p_dark','Тёмная тема','#4c6ef5','🌙',[],
    ()=>`document.body.style.background='#0f1116';document.body.style.color='#e6e9ef';\n`,
    {isStyle:true}));

  out.push(B('p_center','Центрировать','#4c6ef5','◉',[],
    ()=>`document.body.style.margin='0 auto';document.body.style.maxWidth='1100px';\n`,
    {isStyle:true}));

  out.push(B('p_font','Шрифт','#4c6ef5','F',
    [F.text('F','Название','Arial')],
    v=>`document.body.style.fontFamily=${J(v.F)};\n`,
    {isStyle:true}));

  out.push(B('p_fontsize','Размер шрифта','#4c6ef5','A',
    [F.num('N','Размер px',16)],
    v=>`document.body.style.fontSize=${v.N}+'px';\n`,
    {isStyle:true}));

  out.push(B('p_padding','Отступ от краёв','#4c6ef5','▭',
    [F.num('N','Отступ px',16)],
    v=>`document.body.style.padding=${v.N}+'px';\n`,
    {isStyle:true}));

  COLOURS.forEach(([n,hex])=>{
    out.push(B('p_bg_'+hex.replace('#',''),'Фон: '+n,'#4c6ef5','▣',[],
      ()=>`document.body.style.background=${J(hex)};\n`,
      {isStyle:true}));
  });

  return out;
}

/* ================================================================
   ЭЛЕМЕНТЫ
   ================================================================ */
function buildElements(){
  const out = [];

  // Кнопки
  const btnStyles = [
    ['','Кнопка',''],
    ['_primary','Главная кнопка','b.style.background="#4c6ef5";b.style.color="#fff";'],
    ['_danger','Опасная кнопка','b.style.background="#e03131";b.style.color="#fff";'],
    ['_success','Кнопка успеха','b.style.background="#2f9e44";b.style.color="#fff";'],
  ];
  btnStyles.forEach(([suf,label,style])=>{
    const cls = suf==='_primary'?'primary':suf==='_danger'?'danger':suf==='_success'?'success':'';
    out.push(B('e_btn'+suf,label,'#2f9e44','▢',
      [F.text('V','Надпись','Нажми')],
      v=>`__leto_add(document.createElement('button'), function(el){ el.textContent=${J(v.V)}; el.style.cursor='pointer'; el.style.padding='8px 16px'; el.style.border='none'; el.style.borderRadius='6px'; el.style.fontSize='14px'; ${style} });\n`,
      {shape:'button', previewClass:cls, help:'Кнопка.'}));
  });

  // Заголовки
  ['h1','h2','h3'].forEach(t=>{
    const sizes = {h1:'32px',h2:'24px',h3:'19px'};
    out.push(B('e_'+t,'Заголовок '+t.toUpperCase(),'#2f9e44','H',
      [F.text('V','Текст', t==='h1'?'Заголовок':'Подзаголовок')],
      v=>`__leto_add(document.createElement('${t}'), function(el){ el.textContent=${J(v.V)}; });\n`,
      {shape:'heading',size:sizes[t]}));
  });

  // Текст
  out.push(B('e_p','Текст','#2f9e44','¶',
    [F.text('V','Что написать','Привет, мир!')],
    v=>`__leto_add(document.createElement('p'), function(el){ el.textContent=${J(v.V)}; });\n`,
    {shape:'text'}));

  out.push(B('e_b','Жирный','#2f9e44','B',
    [F.text('V','Текст','Важно!')],
    v=>`__leto_add(document.createElement('b'), function(el){ el.textContent=${J(v.V)}; });\n`,
    {shape:'text'}));

  out.push(B('e_i','Курсив','#2f9e44','I',
    [F.text('V','Текст','Примечание')],
    v=>`__leto_add(document.createElement('i'), function(el){ el.textContent=${J(v.V)}; });\n`,
    {shape:'text'}));

  // Картинка
  out.push(B('e_img','Картинка','#2f9e44','🖼',
    [F.text('U','Ссылка','https://picsum.photos/300/200')],
    v=>`__leto_add(document.createElement('img'), function(el){ el.src=${J(v.U)}; el.style.maxWidth='100%'; el.style.borderRadius='8px'; el.style.display='block'; });\n`,
    {shape:'image'}));

  // Списки
  out.push(B('e_ul','Список','#2f9e44','≡',
    [F.text('V','Пункты через ;','раз;два;три')],
    v=>`(function(){var ul=document.createElement('ul'); ${J(v.V)}.split(';').forEach(function(x){var li=document.createElement('li');li.textContent=x.trim();ul.appendChild(li);}); __leto_add(ul);})();\n`,
    {shape:'list'}));

  out.push(B('e_ol','Нумерованный','#2f9e44','1.',
    [F.text('V','Пункты через ;','первый;второй;третий')],
    v=>`(function(){var ol=document.createElement('ol'); ${J(v.V)}.split(';').forEach(function(x){var li=document.createElement('li');li.textContent=x.trim();ol.appendChild(li);}); __leto_add(ol);})();\n`,
    {shape:'list-ol'}));

  // Таблица
  out.push(B('e_table','Таблица','#2f9e44','▦',
    [F.text('V','Строки ; столбцы ,','Имя,Возраст;Аня,12;Боря,13')],
    v=>`(function(){var t=document.createElement('table');t.style.borderCollapse='collapse'; t.style.marginTop='8px'; t.style.marginBottom='8px'; ${J(v.V)}.split(';').forEach(function(r){var tr=document.createElement('tr');r.split(',').forEach(function(c){var td=document.createElement('td');td.textContent=c.trim();td.style.border='1px solid #dee2e6';td.style.padding='6px 10px';tr.appendChild(td);});t.appendChild(tr);}); __leto_add(t);})();\n`,
    {shape:'table'}));

  // Карточки
  ['#ffffff','#f8f9fa','#fff5f5','#e7f5ff','#ebfbee','#fff9db'].forEach((c,i)=>{
    const names = ['белая','серая','розовая','голубая','зелёная','жёлтая'];
    out.push(B('e_card_'+i,'Карточка ('+names[i]+')','#2f9e44','▢',
      [F.text('T','Заголовок','Заголовок'),F.text('V','Текст','Описание')],
      v=>`(function(){var d=document.createElement('div');d.style.padding='16px';d.style.borderRadius='12px';d.style.background=${J(c)};d.style.boxShadow='0 2px 12px rgba(0,0,0,.08)';d.style.margin='8px 0';var h=document.createElement('h3');h.textContent=${J(v.T)};h.style.marginBottom='8px';var p=document.createElement('p');p.textContent=${J(v.V)};d.appendChild(h);d.appendChild(p);__leto_add(d);})();\n`,
      {shape:'card', bg:c}));
  });

  // Поля ввода
  const inputs = [
    ['text','строка','Введите текст'],
    ['email','Email','mail@example.com'],
    ['password','пароль','••••••••'],
    ['number','число','0'],
  ];
  inputs.forEach(([t,label,ph])=>{
    out.push(B('e_in_'+t,'Поле: '+label,'#2f9e44','▭',
      [F.text('P','Подсказка',ph)],
      v=>`__leto_add(document.createElement('input'), function(el){ el.type='${t}'; el.placeholder=${J(v.P)}; el.style.padding='6px 10px'; el.style.borderRadius='6px'; el.style.border='1px solid #ced4da'; el.style.marginRight='6px'; });\n`,
      {shape:'input'}));
  });

  out.push(B('e_textarea','Большое поле','#2f9e44','▤',
    [F.text('P','Подсказка','Напишите…')],
    v=>`__leto_add(document.createElement('textarea'), function(el){ el.placeholder=${J(v.P)}; el.style.padding='8px'; el.style.width='240px'; el.style.height='80px'; el.style.border='1px solid #ced4da'; el.style.borderRadius='6px'; el.style.display='block'; });\n`,
    {shape:'textarea'}));

  out.push(B('e_checkbox','Галочка','#2f9e44','☑',
    [F.text('L','Подпись','Согласен')],
    v=>`__leto_add(document.createElement('label'), function(w){ w.style.display='inline-flex'; w.style.alignItems='center'; w.style.gap='6px'; var c=document.createElement('input'); c.type='checkbox'; w.appendChild(c); w.appendChild(document.createTextNode(${J(v.L)})); });\n`,
    {shape:'checkbox'}));

  out.push(B('e_select','Список выбора','#2f9e44','▼',
    [F.text('V','Пункты через ;','Да;Нет')],
    v=>`__leto_add(document.createElement('select'), function(el){ el.style.padding='6px 10px'; el.style.borderRadius='6px'; el.style.border='1px solid #ced4da'; ${J(v.V)}.split(';').forEach(function(x){var o=document.createElement('option');o.textContent=x.trim();el.appendChild(o);}); });\n`,
    {shape:'select'}));

  return out;
}

/* ================================================================
   СТИЛИ
   ================================================================ */
function buildStyles(){
  const out = [];
  const S = (prop, expr) => `__leto_style(${J(prop)}, ${expr});\n`;

  COLOURS.forEach(([n,hex])=>{
    out.push(B('st_col_'+hex.replace('#',''),'Цвет текста: '+n,'#f08c00','A',[],
      ()=>S('color',J(hex)), {isStyle:true, help:'Красит текст.'}));
  });
  COLOURS.forEach(([n,hex])=>{
    out.push(B('st_bg_'+hex.replace('#',''),'Фон: '+n,'#f08c00','▣',[],
      ()=>S('background',J(hex)), {isStyle:true}));
  });

  [12,14,16,20,24,32,40].forEach(n=>{
    out.push(B('st_fs_'+n,'Размер шрифта '+n,'#f08c00','A',[],
      ()=>S('fontSize', n+"+'px'"), {isStyle:true}));
  });

  ['400','600','700','900'].forEach(w=>{
    out.push(B('st_fw_'+w,'Жирность '+w,'#f08c00','B',[],
      ()=>S('fontWeight',J(w)), {isStyle:true}));
  });

  ['left','center','right'].forEach(a=>{
    out.push(B('st_al_'+a,'Выравнивание: '+a,'#f08c00','≡',[],
      ()=>S('textAlign',J(a)), {isStyle:true}));
  });

  ['padding','margin'].forEach(p=>{
    [4,8,16,24,32].forEach(n=>{
      out.push(B('st_'+p+'_'+n,(p==='padding'?'Внутренний':'Внешний')+' отступ '+n,'#f08c00','▭',[],
        ()=>S(p, n+"+'px'"), {isStyle:true}));
    });
  });

  ['solid','dashed','dotted'].forEach(s=>{
    [1,2,3].forEach(w=>{
      out.push(B('st_br_'+s+'_'+w,'Граница '+w+'px '+s,'#f08c00','▢',[],
        ()=>S('border', w+"+'px "+s+" #1f2430'"), {isStyle:true}));
    });
  });

  [0,4,8,16,24,999].forEach(r=>{
    out.push(B('st_rad_'+r,'Скругление '+r+'px','#f08c00','⌒',[],
      ()=>S('borderRadius', r+"+'px'"), {isStyle:true}));
  });

  [100,200,300,500].forEach(w=>{
    out.push(B('st_w_'+w,'Ширина '+w,'#f08c00','↔',[],
      ()=>S('width', w+"+'px'"), {isStyle:true}));
    out.push(B('st_h_'+w,'Высота '+w,'#f08c00','↕',[],
      ()=>S('height', w+"+'px'"), {isStyle:true}));
  });

  out.push(B('st_italic','Курсив','#f08c00','I',[],
    ()=>S('fontStyle','"italic"'), {isStyle:true}));
  out.push(B('st_ul','Подчёркнутый','#f08c00','_',[],
    ()=>S('textDecoration','"underline"'), {isStyle:true}));
  out.push(B('st_upper','ЗАГЛАВНЫЕ','#f08c00','AA',[],
    ()=>S('textTransform','"uppercase"'), {isStyle:true}));

  return out;
}

let blockIdCounter = 0;
let activeCat = 0;
let autoBuildTimer = null;

const setStatus = t => statusLeft.textContent = t;

function showTooltip(text,x,y){
  tooltip.textContent = text;
  tooltip.style.left = Math.min(x+12, window.innerWidth-300)+'px';
  tooltip.style.top  = (y+16)+'px';

/* ================================================================

function renderCats(){
  catsEl.innerHTML = '';
  CATEGORIES.forEach((cat,i)=>{
    const d = document.createElement('div');
    d.className = 'cat' + (i===activeCat?' active':'');
    d.innerHTML = '<span>'+cat.name+'</span><span class="num">'+cat.blocks.length+'</span>';
    d.onclick = ()=>{ activeCat=i; renderCats(); renderPalette(); };
    catsEl.appendChild(d);
  });
}
function renderPalette(){
  const filter = document.getElementById('search').value.toLowerCase().trim();
  paletteList.innerHTML = '';
  const cat = CATEGORIES[activeCat];
  if (!cat || !cat.blocks.length){
    paletteList.innerHTML = '<div style="padding:20px;color:#868e96;font-size:12px">Пусто</div>';
    return;
  }
  cat.blocks.forEach(b=>{
    if (filter && !b.label.toLowerCase().includes(filter)) return;
    const d = document.createElement('div');
    d.className = 'pblock';
    d.style.setProperty('--c', b.colour);
    d.draggable = true;
    d.innerHTML = '<span class="icon">'+(b.icon||'●')+'</span><span class="label">'+b.label+'</span>';
    d.ondragstart = e=>{ e.dataTransfer.setData('text/plain', b.type); };
    d.onclick = ()=> addBlock(b.type, 60+Math.random()*80, 60+Math.random()*80);
    d.onmouseenter = e=>{ if (b.help) showTooltip(b.help, e.clientX, e.clientY); };
    d.onmouseleave = hideTooltip;
    paletteList.appendChild(d);
  });
}

/* ================================================================
   БЛОКИ
   ================================================================ */
function findDef(type){
  for (const cat of CATEGORIES){
    const b = cat.blocks.find(x=>x.type===type);
    if (b) return b;
  }
  return null;
}
function findById(id){ return canvasBlocks.find(b=>b.id===id); }

function addBlock(type, x, y){
  const def = findDef(type);
  if (!def) return;
  const id = 'b'+(++blockIdCounter);
  const values = {};
  def.fields.forEach(f=> values[f.name]=f.def);
  const block = { id, type, values, x, y, parent: null, children: [] };
  canvasBlocks.push(block);
  renderBlock(block);
  refreshCounters();
  scheduleBuild();
}

function renderBlock(block){
  const def = findDef(block.type);
  if (!def) return;

  const el = document.createElement('div');
  el.className = 'block' + (def.isRoot ? ' isRoot' : '');
  el.style.setProperty('--c', def.colour);
  el.style.left = block.x+'px';
  el.style.top  = block.y+'px';
  el.dataset.id = block.id;

  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<span class="bicon">'+(def.icon||'●')+'</span>'+
                   '<span class="btitle">'+def.label+'</span>';

  const cnt = document.createElement('span');
  cnt.className = 'children-info';
  cnt.textContent = block.children.length ? '↓' + block.children.length : '';
  head.appendChild(cnt);

  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '×';
  del.onclick = e=>{
    e.stopPropagation();
    block.children.forEach(cid=>{
      const c = findById(cid);
      if (c) c.parent = null;
    });
    if (block.parent){
      const p = findById(block.parent);
      if (p) p.children = p.children.filter(x=>x !== block.id);
    }
    canvasBlocks = canvasBlocks.filter(b=>b.id !== block.id);
    el.remove();
    redrawLinks();
    refreshCounters();
    scheduleBuild();
  };
  head.appendChild(del);
  el.appendChild(head);

  if (def.fields.length || def.shape){
    const body = document.createElement('div');
    body.className = 'body';
    if (def.shape && def.shape !== 'simple'){
      const prev = makePreview(def, block);
      if (prev) body.appendChild(prev);
    }
    def.fields.forEach(f=>{
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const lbl = document.createElement('label');
      lbl.textContent = f.label || f.name;
      wrap.appendChild(lbl);
      let inp;
      if (f.type === 'select'){
        inp = document.createElement('select');
        f.options.forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; inp.appendChild(op); });
        inp.value = block.values[f.name];
      } else if (f.type === 'area'){
        inp = document.createElement('textarea');
        inp.rows = 2;
        inp.value = block.values[f.name];
      } else {
        inp = document.createElement('input');
        inp.type = f.type==='color'?'color':f.type==='number'?'number':'text';
        inp.value = block.values[f.name];
      }
      inp.oninput = inp.onchange = ()=>{
        block.values[f.name] = inp.value;
        const p = body.querySelector('.prev-dynamic');
        if (p){
          const newP = makePreview(def, block);
          if (newP){ newP.classList.add('prev-dynamic'); p.replaceWith(newP); }
        }
        scheduleBuild();
      };
      inp.onmousedown = e=>e.stopPropagation();
      wrap.appendChild(inp);
      body.appendChild(wrap);
    });
    el.appendChild(body);
  }

  const snap = document.createElement('div');
  snap.className = 'snap-point';
  snap.title = 'Потяни вниз — присоедини к другому блоку';
  el.appendChild(snap);

  el.classList.add('hasNext');
  makeDraggable(el, block, head);
  makeSnapPoint(snap, el, block);

  canvasEl.appendChild(el);
}

function makePreview(def, block){
  const shape = def.shape;
  let p;
  if (shape === 'button'){
    p = document.createElement('div');
    p.className = 'prev-btn ' + (def.previewClass||'');
    p.textContent = block.values.V || 'Кнопка';
    p.classList.add('prev-dynamic');
  } else if (shape === 'heading'){
    p = document.createElement('div');
    p.className = 'prev-dynamic';
    p.style.fontSize = def.size || '20px';
    p.style.fontWeight = '700';
    p.textContent = block.values.V || 'Заголовок';
  } else if (shape === 'text'){
    p = document.createElement('div');
    p.className = 'prev-dynamic';
    p.textContent = block.values.V || 'Текст';
  } else if (shape === 'list' || shape === 'list-ol'){
    p = document.createElement('div');
    p.className = 'prev-dynamic';
    (block.values.V||'а;б;в').split(';').forEach((it,i)=>{
      const l = document.createElement('div');
      l.textContent = (shape==='list-ol'?(i+1)+'. ':'• ')+it.trim();
      l.style.fontSize = '11px';
      p.appendChild(l);
    });
  } else if (shape === 'table'){
    p = document.createElement('table');
    p.className = 'prev-table prev-dynamic';
    (block.values.V||'A,B;1,2').split(';').forEach(r=>{
      const tr = document.createElement('tr');
      r.split(',').forEach(c=>{ const td=document.createElement('td'); td.textContent=c.trim(); tr.appendChild(td); });
      p.appendChild(tr);
    });
  } else if (shape === 'card'){
    p = document.createElement('div');
    p.className = 'prev-card prev-dynamic';
    p.style.background = def.bg || '#f8f9fa';
    const h = document.createElement('h4'); h.textContent = block.values.T||'Заголовок';
    const t = document.createElement('div'); t.textContent = block.values.V||'Текст';
    p.appendChild(h); p.appendChild(t);
  } else if (shape === 'input' || shape === 'textarea'){
    p = document.createElement('div');
    p.className = 'prev-input prev-dynamic';
    p.textContent = block.values.P || 'Введите…';
    if (shape==='textarea') p.style.height='48px';
  } else if (shape === 'checkbox'){
    p = document.createElement('div');
    p.className = 'prev-dynamic';
    p.style.display='flex'; p.style.gap='6px'; p.style.fontSize='11px';
    p.innerHTML = '<input type="checkbox" disabled><span>'+(block.values.L||'Галочка')+'</span>';
  } else if (shape === 'select'){
    p = document.createElement('div');
    p.className = 'prev-input prev-dynamic';
    p.textContent = (block.values.V||'Да;Нет').split(';')[0].trim()+' ▼';
  } else if (shape === 'image'){
    p = document.createElement('div');
    p.className = 'prev-dynamic';
    p.style.width='100%'; p.style.height='80px';
    p.style.background='#e9ecef'; p.style.borderRadius='8px';
    p.style.display='flex'; p.style.alignItems='center'; p.style.justifyContent='center';
    p.style.color='#868e96'; p.style.fontSize='11px';
    p.textContent='🖼 Картинка';
  }
  return p || null;
}

/* ================================================================
   ПЕРЕТАСКИВАНИЕ + СКРЕПЛЕНИЕ
   ================================================================ */
function makeDraggable(el, block, handle){
  let sx=0, sy=0, ox=0, oy=0, on=false;
  handle.addEventListener('mousedown', e=>{
    if (['INPUT','SELECT','TEXTAREA','BUTTON','LABEL'].includes(e.target.tagName)) return;
    if (e.target.classList.contains('snap-point')) return;
    on = true; sx=e.clientX; sy=e.clientY; ox=block.x; oy=block.y;
    el.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if (!on) return;
    block.x = ox + (e.clientX-sx);
    block.y = oy + (e.clientY-sy);
    el.style.left = block.x+'px';
    el.style.top  = block.y+'px';
    redrawLinks();
  });
  window.addEventListener('mouseup', ()=>{
    if (!on) return;
    on = false;
    el.classList.remove('dragging');
  });
}

function makeSnapPoint(snap, el, block){
  let dragging = false, line = null;
  snap.addEventListener('mousedown', e=>{
    dragging = true;
    e.stopPropagation();
    e.preventDefault();
    line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('stroke','#4c6ef5');
    line.setAttribute('stroke-width','2');
    line.setAttribute('stroke-dasharray','6 4');
    svgLayer.appendChild(line);
  });
  window.addEventListener('mousemove', e=>{
    if (!dragging || !line) return;
    const cr = canvasEl.getBoundingClientRect();
    const br = el.getBoundingClientRect();
    line.setAttribute('x1', br.left-cr.left+40);
    line.setAttribute('y1', br.bottom-cr.top);
    line.setAttribute('x2', e.clientX-cr.left);
    line.setAttribute('y2', e.clientY-cr.top);
  });
  window.addEventListener('mouseup', e=>{
    if (!dragging) return;
    dragging = false;
    if (line){ line.remove(); line = null; }
    const cr = canvasEl.getBoundingClientRect();
    const px = e.clientX-cr.left;
    const py = e.clientY-cr.top;
    let best = null, bestDist = 80;
    canvasBlocks.forEach(other=>{
      if (other.id === block.id) return;
      const otherEl = canvasEl.querySelector('[data-id="'+other.id+'"]');
      if (!otherEl) return;
      const r = otherEl.getBoundingClientRect();
      const topX = r.left-cr.left+40, topY = r.top-cr.top;
      const dTop = Math.hypot(px-topX, py-topY);
      if (dTop < bestDist){ bestDist = dTop; best = other; }
    });
    if (best){
      attachChild(best, block);
    }
    redrawLinks();
    refreshCounters();
    scheduleBuild();
  });
}

function attachChild(parent, child){
  if (child.parent){
    const oldP = findById(child.parent);
    if (oldP) oldP.children = oldP.children.filter(x=>x!==child.id);
  }
  child.parent = parent.id;
  if (!parent.children.includes(child.id)) parent.children.push(child.id);

  const pEl = canvasEl.querySelector('[data-id="'+parent.id+'"]');
  const cEl = canvasEl.querySelector('[data-id="'+child.id+'"]');
  if (pEl && cEl){
    const nx = parent.x;
    const ny = parent.y + pEl.offsetHeight + 14;
    child.x = nx; child.y = ny;
    cEl.style.left = nx+'px';
    cEl.style.top  = ny+'px';
  }
  const pHead = pEl && pEl.querySelector('.children-info');
  if (pHead) pHead.textContent = parent.children.length ? '↓'+parent.children.length : '';

  setStatus('🔗 '+parent.label+' → '+child.label);
}

let svgLayer = null;
function initSvgLayer(){
  svgLayer = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgLayer.style.position = 'absolute';
  svgLayer.style.left = '0'; svgLayer.style.top = '0';
  svgLayer.style.width = '100%'; svgLayer.style.height = '100%';
  svgLayer.style.pointerEvents = 'none';
  svgLayer.style.overflow = 'visible';
  canvasEl.appendChild(svgLayer);
}
function redrawLinks(){
  if (!svgLayer) return;
  Array.from(svgLayer.querySelectorAll('line.link')).forEach(l=>l.remove());
  const cr = canvasEl.getBoundingClientRect();
  canvasBlocks.forEach(b=>{
    b.children.forEach(cid=>{
      const c = findById(cid);
      if (!c) return;
      const el = canvasEl.querySelector('[data-id="'+b.id+'"]');
      const cel = canvasEl.querySelector('[data-id="'+c.id+'"]');
      if (!el || !cel) return;
      const r1 = el.getBoundingClientRect();
      const r2 = cel.getBoundingClientRect();
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.classList.add('link');
      line.setAttribute('stroke','#4c6ef5');
      line.setAttribute('stroke-width','3');
      line.setAttribute('stroke-linecap','round');
      line.setAttribute('x1', r1.left-cr.left+40);
      line.setAttribute('y1', r1.bottom-cr.top);
      line.setAttribute('x2', r2.left-cr.left+40);
      line.setAttribute('y2', r2.top-cr.top);
      svgLayer.appendChild(line);
    });
  });
}

canvasEl.addEventListener('dragover', e=>e.preventDefault());
canvasEl.addEventListener('drop', e=>{
  e.preventDefault();
  const type = e.dataTransfer.getData('text/plain');
  if (!type) return;
  const r = canvasEl.getBoundingClientRect();
  addBlock(type, e.clientX-r.left-40, e.clientY-r.top-20);
});

/* ================================================================
   СБОРКА КОДА
   ----------------------------------------------------------------
   Логика простая:
   1) Идём по блокам сверху вниз (по y).
   2) Для блока-элемента генерим __leto_add(el, cfg).
   3) Для блока-стиля генерим __leto_style(...) — стиль применяется к
      "текущему элементу" (window.__leto_last), либо к body, если текущего нет.
   4) Для root_site — все его дети идут на body (стили применятся к body).
   5) Если у блока есть дети-стили, они генерируются ПЕРЕД кодом самого блока
      (сохраняются в массив pendingStyles), а применяются ПОСЛЕ создания
      элемента.
   ================================================================ */
function buildCode(){
  let result = '';
  const visited = new Set();

  // Собираем стили-дети для каждого родителя
  function stylesOf(block){
    return block.children
      .map(cid=>findById(cid))
      .filter(c=>c && findDef(c.type) && findDef(c.type).isStyle);
  }

  function emit(block, parentIsRoot){
    if (visited.has(block.id)) return;
    visited.add(block.id);

    const def = findDef(block.type);
    if (!def) return;

    if (block.type === 'root_site'){
      // все дети root_site — на body
      block.children.forEach(cid=>{
        const c = findById(cid);
        if (c) emit(c, true);
      });
      return;
    }

    if (def.isStyle){
      // Стиль-корень или стиль на body
      if (parentIsRoot || !block.parent){
        try { result += '/* ' + block.label + ' */\n'; result += def.code(block.values); }
        catch(e){ result += '/* ошибка '+block.type+' */\n'; }
      }
      // Если у стиля есть свой родитель-элемент, он сгенерится там
      return;
    }

    // Обычный блок: сначала соберём его собственные стили-дети
    const pending = stylesOf(block).map(s=>{
      try { return findDef(s.type).code(s.values); } catch(e){ return ''; }
    }).join('');
    // помечаем стили посещёнными
    stylesOf(block).forEach(s=>visited.add(s.id));

    // Генерим код создания элемента с применением стилей
    try {
      const body = def.code(block.values);
      if (pending){
        result += '__leto_pending = [];\n';
        // оборачиваем: применяем стили после создания
        // Наш __leto_add вызовет колбэк после appendChild
        // Проще: сначала вызовем __leto_add, потом применим стили к __leto_last
        result += body;
        // после body — window.__leto_last уже установлен
        result += '/* стили блока ' + block.label + ' */\n';
        result += '__leto_style_block(function(){\n';
        result += pending;
        result += '});\n';
      } else {
        result += body;
      }
    } catch(e){
      result += '/* ошибка '+block.type+': '+e.message+' */\n';
    }

    // Дети-элементы (не стили) — вкладываем внутрь (пока на body)
    block.children.forEach(cid=>{
      const c = findById(cid);
      if (!c) return;
      if (visited.has(c.id)) return;
      const cdef = findDef(c.type);
      if (cdef && cdef.isStyle) return; // уже обработали
      emit(c, parentIsRoot);
    });
  }

  // Сортируем корни по y
  const roots = canvasBlocks
    .filter(b=>!b.parent)
    .sort((a,b)=> a.y - b.y);

  roots.forEach(r=> emit(r, false));

  // На всякий случай — сироты
  canvasBlocks.forEach(b=>{ if (!visited.has(b.id)) emit(b, false); });

  return result;
}

function scheduleBuild(){
  clearTimeout(autoBuildTimer);
  autoBuildTimer = setTimeout(buildSite, 300);
}

/* ================================================================
   СБОРКА САЙТА
   ================================================================ */
function buildSite(){
  let code = '';
  try {
    code = buildCode();
  } catch(e){
    code = 'console.error("Ошибка сборки: " + ' + J(e.message) + ');';
  }

  const html = `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Сайт Лето</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;padding:16px;line-height:1.6;color:#1f2430;margin:0}
  *{box-sizing:border-box}
</style>
</head>
<body>
<script>
(function(){
  window.__leto_last = null;
  window.__leto_pending = null;
  window.__leto_pendingTarget = null;

  // Создать элемент и добавить его в body (или внутрь последнего элемента)
  window.__leto_add = function(el, cfg){
    if (cfg) cfg(el);
    document.body.appendChild(el);
    window.__leto_last = el;
    return el;
  };

  // Применить стиль к последнему элементу (или body)
  window.__leto_style = function(prop, val){
    var target = window.__leto_pendingTarget || window.__leto_last || document.body;
    try { target.style[prop] = val; } catch(e){ console.error('style', prop, e); }
  };

  // Выполнить пачку стилей для "текущего" элемента
  window.__leto_style_block = function(fn){
    var prev = window.__leto_pendingTarget;
    window.__leto_pendingTarget = window.__leto_last || document.body;
    try { fn(); } catch(e){ console.error('style_block', e); }
    window.__leto_pendingTarget = prev;
  };

  // Обработчик события
  window.__leto_on = function(sel, ev, fn){
    try {
      document.querySelectorAll(sel).forEach(function(el){ el.addEventListener(ev, fn); });
    } catch(e){ console.error('on', sel, e); }
  };

  window.onerror = function(m,s,l,c,e){ console.error('[Лето]', m, 'строка', l, e); };
})();

// ============ КОД, СОБРАННЫЙ ИЗ БЛОКОВ ============
try {
${code}
} catch(e){ console.error('[Лето catch]', e); }
<\/script>
</body>
</html>`;
  try {
    previewFrame.srcdoc = html;
    previewInfo.textContent = code.split('\n').filter(Boolean).length+' строк';
    setStatus('✅ Собрано (' + code.split('\n').filter(Boolean).length + ' строк)');
  } catch(e){
    setStatus('Ошибка предпросмотра: '+e.message);
  }
}

/* ================================================================
   СЧЁТЧИКИ + КНОПКИ
   ================================================================ */
function refreshCounters(){
  statusCount.textContent = canvasBlocks.length;
  statusLinks.textContent = canvasBlocks.reduce((s,b)=>s+b.children.length, 0);
  statusTotal.textContent = CATEGORIES.reduce((s,c)=>s+c.blocks.length, 0);
}

document.getElementById('btnBuild').onclick = ()=>{ buildSite(); };
document.getElementById('btnClear').onclick = ()=>{
  if (!canvasBlocks.length) return;
  if (!confirm('Удалить все блоки?')) return;
  canvasBlocks = [];
  canvasEl.innerHTML = '';
  initSvgLayer();
  refreshCounters();
  buildSite();
  setStatus('Очищено');
};
document.getElementById('btnCode').onclick = ()=>{
  const code = buildCode();
  const w = window.open('', '_blank');
  w.document.write('<pre style="white-space:pre-wrap;font:13px monospace;padding:16px">'+
    code.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</pre>');
};
document.getElementById('btnSave').onclick = ()=>{
  const data = { version: 51, blocks: canvasBlocks };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'project.leto'; a.click();
  URL.revokeObjectURL(a.href);
  setStatus('💾 Сохранено');
};
document.getElementById('btnOpen').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e=>{
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data.blocks)) throw new Error('нет blocks');
      canvasBlocks = [];
      canvasEl.innerHTML = '';
      initSvgLayer();
      data.blocks.forEach(b=>{
        b.parent = b.parent||null;
        b.children = b.children||[];
        canvasBlocks.push(b);
        renderBlock(b);
        const n = parseInt(String(b.id).replace(/\D/g,''),10)||0;
        if (n > blockIdCounter) blockIdCounter = n;
      });
      refreshCounters(); redrawLinks(); buildSite();
      setStatus('📂 Загружено: '+f.name);
    } catch(err){ alert('Ошибка: '+err.message); }
  };
  r.readAsText(f);
};
document.getElementById('search').addEventListener('input', renderPalette);
window.addEventListener('resize', redrawLinks);
document.getElementById('canvasWrap').addEventListener('scroll', redrawLinks);

/* ================================================================
   СТАРТ
   ================================================================ */
try {
  initSvgLayer();
  renderCats();
  renderPalette();
  refreshCounters();
  buildSite();
  setStatus('🌞 Лето 5.1 загружено');
} catch(e){
  console.error(e);
  showError('Ошибка старта: '+e.message);
}
</script>
</body>
</html>

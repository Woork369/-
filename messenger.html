<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мессенджер-Лето</title>
    <link rel="stylesheet" href="messenger-style.css">
</head>
<body>
    <div class="app-layout" id="app-container">
        <!-- Боковая панель -->
        <aside class="sidebar-section">
            <div class="user-bar">
                <div class="user-info">
                    <div class="user-avatar" id="my-avatar-badge"></div>
                    <span class="user-display-name" id="active-username">Загрузка...</span>
                </div>
            </div>
            
            <div class="filter-navigation">
                <button class="tab-btn active" data-type="contact">Контакты</button>
                <button class="tab-btn" data-type="group">Группы</button>
                <button class="tab-btn" data-type="channel">Каналы</button>
            </div>

            <div class="action-zone" style="padding: 10px 16px;">
                <button id="main-dynamic-action-btn">➕ Добавить новый контакт</button>
            </div>

            <div class="dialogs-list" id="chats-list-target">
                <!-- Сюда динамически рендерятся карточки -->
            </div>
        </aside>

        <!-- Окно чата -->
        <main class="chat-section">
            <!-- Начальная заглушка -->
            <div id="fallback-notice" class="system-notice-container">
                <div class="system-notice">Выберите диалог для начала общения</div>
            </div>

            <!-- Шапка чата (70px) -->
            <header id="active-chat-header" class="chat-workspace-header" style="display: none;">
                <button id="mobile-back-btn" class="back-to-list-btn">⬅️</button>
                <div class="active-chat-meta">
                    <div class="user-avatar small" id="chat-header-avatar"></div>
                    <div class="chat-title-container">
                        <div class="chat-title-row">
                            <span class="chat-title-text" id="target-chat-name">Чат</span>
                            <span id="header-verified-geo"></span>
                        </div>
                        <span class="chat-status-text" id="target-chat-status"></span>
                    </div>
                </div>
                <button id="gear-btn" class="tool-btn" style="display: none;">⚙️</button>
            </header>

            <!-- Лента сообщений -->
            <div class="messages-viewport" id="messages-screen">
                <!-- Плашка блокировки приватности -->
                <div id="privacy-lock-screen" class="privacy-lock" style="display: none;">
                    <div class="lock-card">
                        <span class="lock-icon">🔒</span>
                        <h3>Доступ запрещен</h3>
                        <p>Вы не являетесь участником этой закрытой группы.</p>
                    </div>
                </div>
            </div>

            <!-- Зона ввода -->
            <div class="message-input-zone" id="input-zone" style="display: none;">
                <div class="input-container-row">
                    <button class="icon-btn" id="clip-btn">📎</button>
                    <input type="text" id="main-message-field" placeholder="Напишите сообщение...">
                    <button class="icon-btn" id="mic-btn">🎤</button>
                    <button class="send-action-btn" id="send-btn">Отправить</button>
                </div>
            </div>

            <!-- Панель настроек комнаты -->
            <div id="leto-room-settings-panel" class="room-settings-fullscreen" style="display: none;">
                <div class="settings-header">
                    <button id="close-settings-btn" class="icon-btn">⬅️</button>
                    <h2>Настройки комнаты</h2>
                </div>
                <div class="settings-body">
                    <div class="settings-group">
                        <label>Название комнаты</label>
                        <input type="text" id="settings-room-name">
                    </div>
                    <div class="settings-group">
                        <label>Описание</label>
                        <textarea id="settings-room-desc"></textarea>
                    </div>
                    <div class="settings-group">
                        <label>Обновить аватарку</label>
                        <input type="file" id="settings-room-avatar" accept="image/*">
                    </div>
                    <div class="settings-group" id="settings-add-user-zone">
                        <label>Добавить человека (Юзернейм)</label>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="settings-add-username" placeholder="юзернейм">
                            <button id="settings-add-user-btn" class="accent-btn">Добавить</button>
                        </div>
                    </div>
                    <div class="settings-actions">
                        <button id="settings-save-btn" class="save-btn">Сохранить изменения</button>
                        <button id="settings-delete-btn" class="delete-btn">🗑️ Удалить комнату</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Модалка создания группы/канала -->
    <div class="modal-overlay" id="create-room-modal" style="display: none;">
        <div class="modal-card">
            <h3 id="modal-title">Создание</h3>
            <input type="text" id="modal-room-name" placeholder="Название">
            <input type="text" id="modal-room-desc" placeholder="Описание">
            <div style="margin: 10px 0; font-size:13px;">
                <label>Аватарка комнаты:</label>
                <input type="file" id="modal-room-avatar" accept="image/*">
            </div>
            <div class="modal-buttons">
                <button id="modal-cancel-btn">Отмена</button>
                <button id="modal-submit-btn">Создать</button>
            </div>
        </div>
    </div>

    <!-- Нативное кастомное контекстное меню -->
    <div id="leto-context-menu" class="custom-context-menu" style="display: none;">
        <div class="context-item" id="ctx-edit">✏️ Редактировать</div>
        <div class="context-item delete" id="ctx-delete">🗑️ Удалить</div>
        <div class="context-item delete-admin" id="ctx-delete-admin" style="display: none;">🗑️ Удалить (Админ)</div>
    </div>
</body>
</html>

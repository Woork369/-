<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лето — Мессенджер</title>
    <link rel="stylesheet" href="messenger-style.css">
    
    <!-- КРИТИЧЕСКИ ВАЖНО: Подключаем сеть PubNub строго до основного скрипта! -->
    <script src="https://pubnub.com"></script>
</head>
<body>

    <div class="messenger-container" id="messenger-app">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ (СПИСОК ЧАТОВ И НАСТРОЙКИ) -->
        <aside class="sidebar" id="sidebar-panel">
            <!-- Шапка сайдбара -->
            <div class="sidebar-header">
                <div class="user-profile">
                    <span class="avatar">☀️</span>
                    <span id="current-user-display" class="username">Загрузка...</span>
                </div>
                <!-- Переход к настройкам профиля -->
                <a href="settings.html" class="settings-btn" title="Настройки профиля">⚙️</a>
            </div>

            <!-- ПОЛЕ ПОИСКА КАНАЛОВ И КОНТАКТОВ -->
            <div class="search-bar">
                <input type="text" id="global-search" placeholder="Поиск каналов или групп...">
            </div>

            <!-- КНОПКИ БЫСТРОГО СОЗДАНИЯ -->
            <div class="creation-bar">
                <button id="open-contact-modal" class="action-mini-btn">➕ Контакт</button>
                <button id="open-group-modal" class="action-mini-btn">👥 Группа</button>
                <button id="open-channel-modal" class="action-mini-btn">📢 Канал</button>
            </div>

            <!-- Контейнер для динамического списка чатов -->
            <div class="chats-list" id="chats-list"></div>
        </aside>

        <!-- ПРАВАЯ ПАНЕЛЬ (ОКНО АКТИВНОЙ ПЕРЕПИСКИ) -->
        <main class="chat-window hidden-mobile" id="chat-panel">
            <!-- Шапка активного диалога -->
            <div class="chat-header" id="active-chat-header">
                <div class="chat-title-info">
                    <!-- Кнопка «Назад» для mobile (возврат к списку чатов) -->
                    <button id="back-to-list-btn" class="back-mobile-btn">◀</button>
                    <div class="text-info-block">
                        <h3 id="chat-current-name">Выберите чат для начала общения</h3>
                        <p id="chat-current-status" class="chat-status"></p>
                    </div>
                </div>
                <div class="header-controls">
                    <div id="e2ee-badge" class="e2ee-badge hidden">🔒 Сквозное шифрование</div>
                    <!-- Управление для вас как для Создателя -->
                    <button id="channel-settings-btn" class="channel-settings-btn hidden" title="Настройки канала">⚙️ Управление</button>
                </div>
            </div>

            <!-- Поле отображения сообщений -->
            <div class="chat-messages" id="chat-messages">
                <div class="empty-chat-message">
                    <span style="font-size: 48px;">☀️</span>
                    <p>Выберите, кому хотите написать, или найдите канал через поиск</p>
                </div>
            </div>

            <!-- Нижняя область ввода сообщений и файлов -->
            <form class="chat-input-form" id="chat-input-form">
                <!-- Скрытый системный инпут для выбора вложений -->
                <input type="file" id="file-attachments" style="display: none;" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt,.zip">
                
                <button type="button" id="attach-btn" class="attach-btn" disabled title="Прикрепить файл">📎</button>
                <!-- Убран атрибут required, чтобы файлы отправлялись без обязательного текста -->
                <input type="text" id="message-text" placeholder="Напишите сообщение..." autocomplete="off" disabled>
                <button type="submit" id="send-message-btn" class="send-btn" disabled>▶</button>
            </form>
        </main>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО №1: СОЗДАНИЕ СУЩНОСТЕЙ (КОНТАКТ, ГРУППА, КАНАЛ) -->
    <div id="custom-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 id="modal-title">Создание</h3>
            <p id="modal-description" class="modal-desc"></p>
            <input type="text" id="modal-input" placeholder="Введите значение">
            <p id="modal-error" class="modal-error-msg hidden"></p>
            <div class="modal-buttons">
                <button id="modal-cancel-btn" class="modal-btn cancel">Отмена</button>
                <button id="modal-confirm-btn" class="modal-btn confirm">Создать</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО №2: ПРЕДПРОСМОТРА И ОПИСАНИЯ ФАЙЛА -->
    <div id="file-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>Отправка медиафайла</h3>
            <p id="file-modal-info" class="modal-desc">Файл готов к отправке</p>
            <div id="file-preview-zone" class="preview-zone-block"></div>
            <input type="text" id="file-caption-input" placeholder="Добавить подпись (необязательно)..." autocomplete="off">
            <div class="modal-buttons">
                <button id="file-cancel-btn" class="modal-btn cancel">Отмена</button>
                <button id="file-send-btn" class="modal-btn confirm">Отправить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО №3: ПОЛНОЭКРАННЫЙ ПРОСМОТР ФОТО И ВИДЕО (КАК В ТГ) -->
    <div id="media-viewer-modal" class="modal-overlay hidden">
        <span id="close-viewer-btn">&times;</span>
        <div id="viewer-content">
            <!-- Сюда JavaScript будет динамически подставлять картинку или видео во весь экран -->
        </div>
    </div>

    <!-- Подключаем основной скрипт логики мессенджера -->
    <script src="messenger-script.js"></script>
</body>
</html>
